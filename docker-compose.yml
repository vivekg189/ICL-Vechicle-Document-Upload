# ==============================================================================
# VehicleVault — Full Stack Docker Compose Environment
# Architecture:
#   React (frontend) -> Flask (backend) -> PostgreSQL (postgres)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vehiclevault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vehiclevault}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vehiclevault}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Flask REST Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vehiclevault-backend
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME:-vehiclevault}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-1234}@postgres:5432/${DB_NAME:-vehiclevault}
      PORT: 5000
      FLASK_ENV: production
      RUNNING_IN_DOCKER: "true"
    volumes:
      - vehicle_documents:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  # ----------------------------------------------------------------------------
  # 3. React Frontend Service (Nginx Reverse-Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: vehiclevault-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    ports:
      - "3000:80"

# ------------------------------------------------------------------------------
# Persistent Volumes
# ------------------------------------------------------------------------------
# postgres_data : stores PostgreSQL WAL, tables, and metadata.
# vehicle_documents : stores uploaded PDF files; survives backend container recreations.
volumes:
  postgres_data:
  vehicle_documents:
